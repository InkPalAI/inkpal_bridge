name: inkpal_bridge
description: >-
  Let AI agents inspect, debug, and control your running Flutter app — read
  widgets, tap, screenshot, capture errors. Zero deps. Debug-only.
version: 1.4.7
repository: https://github.com/InkPalAI/inkpal_bridge
homepage: https://inkpal.ai
issue_tracker: https://github.com/InkPalAI/inkpal_bridge/issues

topics:
  - mcp
  - ai
  - claude
  - copilot
  - agent

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
